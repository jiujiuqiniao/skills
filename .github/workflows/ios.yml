name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Check cancellation and audio classification
        run: |
          swiftc RequestPolicy.swift RequestPolicyTests.swift -o "$RUNNER_TEMP/request-policy-tests"
          "$RUNNER_TEMP/request-policy-tests"
      - name: Build unsigned app
        run: |
          xcodebuild -project SodaNative.xcodeproj -scheme SodaNative -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/build/Build/Products/Release-iphoneos/SodaNative.app" "$RUNNER_TEMP/package/Payload/"
          (cd "$RUNNER_TEMP/package" && zip -qry "$GITHUB_WORKSPACE/SodaNative-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: SodaNative-unsigned-ipa
          path: SodaNative-unsigned.ipa
